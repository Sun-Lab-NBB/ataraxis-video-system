# Defines the build system used for the project.
[build-system]
requires = ["hatchling>=1,<2"]
build-backend = "hatchling.build"

# Project metadata section. Provides the general ID information about the project.
[project]
name = "ataraxis-video-system"
version = "5.0.0rc1"
description = "Interfaces with a wide range of cameras to flexibly record visual stream data as video files."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.15"
authors = [
    { name = "Ivan Kondratyev" },
    { name = "Jacob Groner" },
    { name = "Natalie Yeung" },
]
maintainers = [
    { name = "Ivan Kondratyev", email = "ik278@cornell.edu" },
]

keywords = ["OpenCV", "FFMPEG", "GenICam", "video recording", "camera interface", "ataraxis"]

classifiers = [
    # Development status
    "Development Status :: 5 - Production/Stable",
    # Intended audience and project topic
    "Intended Audience :: Developers",
    "Topic :: Multimedia :: Video",
    # Supported Python Versions
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    # Supported Operating Systems
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    # Typing
    "Typing :: Typed",
]

# Runtime project dependencies.
dependencies = [
    # Array Processing
    "numpy>=2,<3",

    # Video Acquisition
    "opencv-python>=5,<6",

    # GenICam Video Acquisition. The 'genicam' distribution publishes no macOS wheel for every Python version this
    # library supports, so the GenICam camera interface is unavailable on macOS and its runtime is left out of the
    # installation there. Every other library feature works on macOS as usual.
    "harvesters>=1,<2; sys_platform != 'darwin'",
    "genicam>=1,<2; sys_platform != 'darwin'",

    # CLI
    "click>=8,<9",

    # Data Output
    "polars>=1,<2",

    # Configuration
    "platformdirs>=4,<5",

    # Cross-process File Locking
    "filelock>=3,<4",

    # Host Resource Introspection
    "psutil>=7,<8",

    # MCP Server
    "mcp>=2,<3",

    # Ataraxis Libraries
    "ataraxis-time>=7,<8",
    "ataraxis-base-utilities>=7,<8",
    "ataraxis-data-structures>=7.1,<8",  # 7.1 first exports the archive indexing log discovery reads
]

# Project repository and hosted documentation URLs.
[project.urls]
Homepage = "https://github.com/Sun-Lab-NBB/ataraxis-video-system"
Documentation = "https://ataraxis-video-system-api-docs.netlify.app/"

# Exposes the 'axvs' CLI, which covers camera discovery and runtime checks, CTI file management, interactive
# recording, GenICam node configuration, log processing, and the MCP server.
[project.scripts]
axvs = "ataraxis_video_system.interfaces.cli:axvs_cli"

# Development dependencies (PEP 735). Not published to PyPI.
[dependency-groups]
dev = [
    # Tox
    "tox>=4,<5",
    "uv>=0,<1",
    "tox-uv>=1,<2",

    # Development Automation
    "ataraxis-automation>=9,<10",

    # Types
    "types-psutil>=7,<8",
]

# Specifies files that should not be included in the source-code distribution.
[tool.hatch.build.targets.sdist]
exclude = [".github", "recipe"]

# Specifies the library structure.
[tool.hatch.build.targets.wheel]
packages = ["src/ataraxis_video_system"]

# Ruff Configuration.
[tool.ruff]
line-length = 120
indent-width = 4
target-version = "py312"  # Targets the lowest supported version of python
src = ["src"]

# Excludes 'service' .py files, such as the sphinx configuration file, from linting.
extend-exclude = ["conf.py"]

# Checks for all potential violations and uses the exclusions below to target-disable specific ones.
lint.select = ["ALL"]

# General ignore directives
lint.ignore = [
    # Universal lint.ignore corpus. Present in every Ataraxis framework and Sollertia platform project.
    "W291",    # Conflicts with docstring formatting
    "ANN401",  # While suboptimal, ANY is a helpful type when used with caution
    "BLE001",  # Broad exception handling is necessary at library boundaries
    "C901",    # Sometimes complex functions are necessary
    "PLR0911", # Sometimes complex return graphs are necessary
    "PLR0912", # Sometimes complex functions are necessary
    "PLR0913", # Sometimes complex functions are necessary
    "PLR0915", # Sometimes functions with many statements are necessary
    "PLR0917", # PLR0913 already covers argument counts, and call sites pass keyword arguments
    "COM812",  # Conflicts with the formatter
    "ISC001",  # Conflicts with the formatter
    "PT001",   # https://github.com/astral-sh/ruff/issues/8796#issuecomment-1825907715
    "PT023",   # https://github.com/astral-sh/ruff/issues/8796#issuecomment-1825907715
    "D107",    # __init__ is documented inside the main class docstring where applicable
    "D205",    # Bugs out for file descriptions
    "PLW0603", # While global statement usage is not ideal, it streamlines certain development patterns
    "TID252",  # Conflicts with the library import management strategy, which requires parent-relative imports
    "CPY001",  # The license is declared in the LICENSE file and the license and license-files metadata fields
]

# Additional formatting configurations
[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false  # Like black, honors magic trailing commas
line-ending = "auto"               # Automatically detects and standardizes line-ending character

# Docstrings and comments' line length
[tool.ruff.lint.pycodestyle]
max-doc-length = 120  # Maximum documentation line length, the same as code

# Docstrings style
[tool.ruff.lint.pydocstyle]
convention = "google"

# Additional, file-specific 'ignore' directives
[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = [
    "F401", # Imported but unused
    "F403", # Wildcard imports
]
"tests/**/*.py" = [
    # Shared test corpus. These entries are present in every Ataraxis framework and Sollertia platform project.
    "S101",    # Tests assert by design
    "PLR2004", # Expected values are clearer inline than as named constants
    "INP001",  # The test directory is not an importable package
    "SLF001",  # Tests exercise private module members directly
    "PT006",   # Parametrize argument names are declared as a single comma-separated string
    "ARG001",  # Pytest injects fixtures that individual tests may not reference
    "T201",    # Diagnostic prints are how a test reports intermediate state
    "D",       # Test names and inline comments carry the intent that docstrings carry in library code
    "ANN",     # Test functions and mock helpers do not need annotations

    # Project-specific
    "S311",    # A unique DataLogger instance name is drawn with the standard pseudo-random generator
]

# Import sorting and grouping configurations.
[tool.ruff.lint.isort]
case-sensitive = true
combine-as-imports = true          # Combines multiple "as" imports for the same package
force-wrap-aliases = true          # Wraps "as" imports so that each uses a separate line
force-sort-within-sections = true  # Forces "as" and "from" imports for the same package to be close
length-sort = true                 # Places shorter imports first

# MyPy configuration section.
[tool.mypy]
# Strict mode settings (--strict), plus the unused-config warning that --strict does not enable
warn_unused_configs = true
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
no_implicit_reexport = true
strict_equality = true

extra_checks = true

pretty = true

exclude = [
    "ataraxis_video_system-\\d+",  # The temporary folder created when building the sdist
    "venv.*/",
    "build/",
    "dist/",
    "docs/",
    "stubs/",                      # stubgen output target
    "recipe/",                     # grayskull output target
    "tests/",
]

# Treats the GenICam runtime as untyped, which it is, and also keeps the source type-checking on macOS, where the
# runtime is not installed at all and would otherwise be reported as a missing import rather than an untyped one.
[[tool.mypy.overrides]]
module = ["harvesters.*", "genicam.*"]
ignore_missing_imports = true

# Pytest configuration. The import mode is declared here so that a bare 'pytest' invocation resolves test modules the
# same way the '{py}-test' tox task does.
[tool.pytest.ini_options]
addopts = "--import-mode=importlib"

# Places the repository root on sys.path, so that the 'tests' package is importable by the test modules that share the
# synthetic GenICam node map, the synthetic log archive builders, and the fake OpenCV and Harvesters camera doubles.
# The import mode above resolves test modules without touching sys.path, which leaves a sibling helper unreachable on
# its own. The src layout keeps this entry from shadowing the installed distribution the tests measure coverage
# against.
pythonpath = ["."]

# Lists the source files excluded from coverage measurement in full. The interfaces subpackage holds the CLI and the
# MCP server tools, which are covered by the tests written for the library functions they wrap. The 'parallel' and
# 'concurrency' keys extend measurement to the spawned producer and consumer processes, to the log processing pool
# workers that run run_extraction_job, and to the job execution manager, watchdog, frame display, and stderr drain
# threads. Each worker then writes its own data file for the 'coverage' task to combine. The test corpus is omitted
# because a spawned child re-reads this file without the '--cov' package restriction its parent was launched with. A
# test module that a child imports, which is every module handing a spawned process one of its own functions, is
# otherwise measured as source.
[tool.coverage.run]
parallel = true
concurrency = ["multiprocessing", "thread"]
omit = ["*/ataraxis_video_system/interfaces/*", "*/tests/*"]

# Used by the 'coverage' tox task to merge the coverage data files the '{py}-test' tasks produce.
[tool.coverage.paths]

# Maps coverage measured in site-packages to source files in src. The second pattern matches the POSIX virtual
# environment layout and the third matches the Windows layout, which omits the 'python*' path component. Both are
# required for the 'coverage' task to merge the data measured by each 'test' task into a single record per source file.
# Without the merge, every statement is judged against a single python version, so any statement that only executes on
# some of the tested versions is misreported as uncovered.
source = [
    "src/",
    ".tox/*/lib/python*/site-packages/",
    ".tox/*/Lib/site-packages/",
]

# Same as above, specifies the output directory for the coverage .html report
[tool.coverage.html]
directory = "reports/coverage_html"

# Specifies the coverage gate and additional ignore directives
[tool.coverage.report]
fail_under = 100     # Requires the test suite to cover every measured statement
show_missing = true  # Lists the statements missed by the test suite, so a failed check names the lines to cover
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    '^\s*pass$',
]
